name: snake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#19e6ff&color_dots=#161b22,#3b1512,#7a1d16,#c4241a,#ff2a1d
            dist/snake-light.svg?palette=github-light&color_snake=#0aa3b8&color_dots=#ebedf0,#ffcfc9,#ff9086,#ff5a4c,#ff2a1d

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
